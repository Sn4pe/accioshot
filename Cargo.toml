[workspace]
members = [".", "editor"]
# The editor needs WebKit and a built frontend, the CLI and tray do not.
default-members = ["."]

[package]
name = "accioshot"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Screenshot capture and upload tool for Linux and macOS"
repository = "https://github.com/Sn4pe/accioshot"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
fancy-regex = "0.20"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.13", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
toml = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", features = ["screenshot"] }
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wl-clipboard-rs = "0.9"
zbus = { version = "6", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
