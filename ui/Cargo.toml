[package]
name = "accioshot-ui"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Editor, history and settings windows for accioshot"
repository = "https://github.com/Sn4pe/accioshot"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
accioshot = { path = ".." }
dirs = "7"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-drag = "2.1"
toml = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
