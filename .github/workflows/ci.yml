name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: ui/web
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev ripgrep
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run lint && npm run format:check && npm run check && npm test && npm run build
        working-directory: ui/web
      - name: No comments or silenced checks
        run: |
          found=0
          rg -n '^\s*//' src ui/src | rg -v 'SPDX-License-Identifier|Ported from ShareX|Copyright \(c\)' && found=1
          rg -n 'allow\(|expect\(clippy' src ui/src && found=1
          rg -n '(^|\s)//|/\*|<!--|svelte-ignore|eslint-disable|@ts-ignore|@ts-expect-error' ui/web/src | rg -v 'SPDX-License-Identifier' && found=1
          exit $found
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
