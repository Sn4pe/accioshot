[package]
name = "accioshot-editor"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Image editor for accioshot"
repository = "https://github.com/Sn4pe/accioshot"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "7"
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["custom-protocol"] }
toml = "1"
